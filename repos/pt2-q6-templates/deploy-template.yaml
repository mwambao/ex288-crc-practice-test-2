apiVersion: template.openshift.io/v1
kind: Template
metadata: {name: pt2-deploy-template}
parameters:
- {name: NAMESPACE, value: template-lab}
- {name: APP_NAME, required: true}
- {name: REPLICAS, value: "1"}
- {name: APP_HOST, required: true}
objects:
- apiVersion: apps/v1
  kind: Deployment
  metadata: {name: "${APP_NAME}"}
  spec:
    replicas: ${{REPLICAS}}
    selector: {matchLabels: {app: "${APP_NAME}"}}
    template:
      metadata: {labels: {app: "${APP_NAME}"}}
      spec:
        containers:
        - name: app
          image: "image-registry.openshift-image-registry.svc:5000/${NAMESPACE}/${APP_NAME}:latest"
          ports: [{containerPort: 8080}]
- apiVersion: v1
  kind: Service
  metadata: {name: "${APP_NAME}"}
  spec: {selector: {app: "${APP_NAME}"}, ports: [{port: 8080, targetPort: 8080}]}
- apiVersion: route.openshift.io/v1
  kind: Route
  metadata: {name: "${APP_NAME}"}
  spec: {host: "${APP_HOST}", to: {kind: Service, name: "${APP_NAME}"}}
